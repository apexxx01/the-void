kind = "web"
previewPath = "/"
title = "void."
version = "1.0.0"
id = "artifacts/void-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23077

[services.development]
run = "pnpm --filter @workspace/void-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/void-app", "run", "build" ]
publicDir = "artifacts/void-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23077"
BASE_PATH = "/"
